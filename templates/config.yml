# .workbench/config.yml
#
# A complete sample: every field the format has, each with a comment.
# The configuration guide explains each field in full.
#
# Rules that apply everywhere:
#   - The workspace root is the folder that holds `.workbench/`.
#   - Unknown fields are errors.
#   - Paths use `/`.
#   - Secrets are never written here, only the names of the environment variables that hold them.
#
# Sections, in order: version, projects, compose (shared stacks), storage, analysis,
# then the reserved sections lsp and semantic.

version: 1                     # required; this file format's version. Always 1

# ---------------------------------------------------------------------------------------------
# projects: required; at least one
# ---------------------------------------------------------------------------------------------
projects:
  - id: shared-api             # stable, kebab-case, unique. Changing it re-identifies every node of the project
    path: libs/shared-api      # relative to the workspace root, or absolute; no project path may be
                               # the same as, or inside, another's
    language: python           # the project's main language: python | typescript. Roadmap: go.
                               # The first release reads the source code of python projects only; a typescript
                               # project still appears with its binaries, dependencies and links
    dependency_manager: uv     # python: poetry | uv; typescript: npm | pnpm | yarn | bun
    import_names: [shared_api] # optional; names other projects import this one by; unique across the workspace.
                               # Default: read from the project's own manifest

  - id: billing-api
    path: services/billing
    language: python
    dependency_manager: uv
    exclude:                   # optional; files to leave out of the graph, on top of what .gitignore excludes.
                               # Glob patterns relative to the project. A binary's `entry` must not be excluded
      - "src/billing/generated/**"
      - "**/*_pb2.py"
    dependencies:              # optional; local dependencies: other projects whose code this one uses
      discover: true           # default true: read local dependencies from the dependency manager's files
      local:                   # optional; additional local dependencies, hand-written
        - project: shared-api  # required; a project id in this file, and not this project
          scope: build         # optional: build | dev. Default: build. Roadmap: runtime
          note: imported only through a plugin loader   # optional, free text
    binaries:                  # optional; hand-written, never detected
      - name: api              # required; unique within the project
        entry: src/billing/main.py    # required; relative to the project; the file must exist
        framework: fastapi     # optional; python: fastapi | none; typescript: angular | none. Set on a binary only.
                               # Default: read from a compose command that runs this binary, else from the
                               # entry file, else none
        app: billing.app:create_app   # optional, fastapi only; the app as module:attribute, as uvicorn writes it.
                               # An app object or a function that returns one. Needed only when neither a
                               # compose command nor the entry file names it, such as an app factory
      - name: worker
        entry: src/billing/worker.py  # no framework written: read from its files, here none
    links:                     # optional; runtime links the code does not reveal, hand-written
      - service: kafka         # the target: exactly one of `service` or `project`. A service is named as in a compose file
        stack: billing-stack   # with `service` only: the Compose name of the target's stack, needed when
                               # that service name is in more than one stack
        via: topic             # required: http | grpc | topic | queue | database.
                               # topic, queue and database need a `service` target
        name: invoice.created  # topic and queue only, and required for them
        role: publish          # topic and queue only, and required for them: publish | subscribe
        binary: worker         # optional; which of this project's own binaries makes the link
        note: sent after each billing run   # optional, free text
    compose:                   # optional; this project's own stack. Add it only to fill a gap
      files:                   # optional; inside the project, in the order Docker is given them.
                               # Default: the first of compose.yaml, compose.yml, docker-compose.yaml,
                               # docker-compose.yml at the project root, then its override file if there is one
        - docker-compose.yml
        - docker-compose.dev.yml
      name: billing-dev        # optional; as for the shared stacks below
      networks:                # optional; as for the shared stacks below. The same real name in two stacks links them
        backend: acme-backend
      services:                # optional; as for the shared stacks below, with the project implied
        api:
          binary: api
    environment:               # optional; how to enter the project's environment, for language servers.
                               # Reserved: read and checked, not used in the first release
      venv: .venv              # the virtual environment folder, relative to the project
      activate: uv run         # the command that runs a program inside the environment
    lsp:                       # optional; overrides the workspace-wide `lsp` defaults at the end of this file.
                               # Reserved: read and checked, not used in the first release
      enabled: true
      server: basedpyright
      command: [basedpyright-langserver, --stdio]   # optional launch override
      settings:                # passed to the server as-is; the one place unknown fields are allowed
        python.analysis.typeCheckingMode: standard
      servers:                 # optional: one entry per file kind; the fields above are shorthand
                               # for the project's main kind
        yaml: {server: yaml-language-server}
        dockerfile: {enabled: false}

  - id: web-app
    path: ../shared/web        # may sit outside the workspace root
    language: typescript
    dependency_manager: pnpm
    dependencies:
      discover: false          # use only what is listed under `local`
    binaries:
      - name: admin
        entry: projects/admin/src/main.ts
        framework: angular
      - name: shop
        entry: projects/shop/src/main.ts
        framework: angular
    links:
      - project: billing-api   # a project id in this file, and not this project. Name a `service` instead
                               # to say which of the target's binaries receives the call
        via: http
        binary: admin
        note: calls the billing API

# ---------------------------------------------------------------------------------------------
# compose: optional; shared stacks, made of compose files that belong to no single project.
# Each entry is one stack. A compose file appears in one stack only, here or under a project.
# ---------------------------------------------------------------------------------------------
compose:
  - files:                     # required; the stack's compose files, in the order Docker is given them (`-f a -f b`).
                               # A later file overrides an earlier one. Relative to the workspace root, or absolute
      - docker-compose.yml
      - docker-compose.dev.yml
    projects:                  # required; every project that uses this stack; each a project id in this file
      - billing-api
      - web-app
    name: billing-stack        # optional; the Compose name the stack runs under, when it is set outside the files
                               # (`-p` or COMPOSE_PROJECT_NAME). Default: the `name` in the files, else the first
                               # file's folder name. No two stacks may have the same Compose name
    networks:                  # optional; the real name of a network when the files cannot state it,
                               # for example a name built from ${NET_NAME}. Without an entry such a network is a
                               # warning. An entry always wins over the name in the files; the override is only logged.
                               # Services in different stacks can reach each other only through a shared network
      backend: acme-backend    # key: the network as named in the files. Value: its real name, used exactly as written
    services:                  # optional; one entry per service the indexer cannot match on its own.
                               # Default: the project from the build context, the binary from the build target.
                               # A service with no build context and no entry here is an external service.
                               # Each key must be a service in these files
      billing:
        project: billing-api   # required; must also be listed under `projects` above
        binary: api            # optional; by name from that project's `binaries`
      billing-worker:          # built from the same Dockerfile as `billing`, runs a different binary
        project: billing-api
        binary: worker

# ---------------------------------------------------------------------------------------------
# storage: optional; written by `workbench init`. Every field is optional
# ---------------------------------------------------------------------------------------------
storage:
  backend: sqlite              # sqlite (default). Roadmap: memgraph; `memgraph` and the memgraph fields
                               # below are refused until then
  path: .workbench/graph.db    # sqlite only; relative to the workspace root, or absolute
  # host: localhost            # memgraph only; default localhost
  # port: 7687                 # memgraph only; default 7687
  # namespace: billing-3f9a    # memgraph only; one per workspace, unique on that Memgraph
  # username: workbench        # memgraph only; optional, Memgraph has no login unless one is set up
  # password_env: MEMGRAPH_PASSWORD   # memgraph only; the variable's name, never the password

# ---------------------------------------------------------------------------------------------
# analysis: optional; how far `index` analyses the graph after reading every file
# ---------------------------------------------------------------------------------------------
analysis:
  flow_rounds: 10              # optional; default 10; a whole number from 0 to 100. How many call levels
                               # a type is carried from callers into parameters that have no annotation.
                               # 0 turns it off. `status` warns when the limit stopped it early

# ---------------------------------------------------------------------------------------------
# Reserved sections: read and checked for shape, not used in the first release
# ---------------------------------------------------------------------------------------------
lsp:                           # optional; workspace-wide language server defaults, one entry per language
  python:
    server: basedpyright

semantic:                      # optional
  llm:
    provider: claude           # copilot-cli | ollama | claude
    model: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY   # claude only: the variable's name, never the key
