[package]
name = "semantic-workbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
readme = "README.md"

[[bin]]
name = "workbench"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["dep:sqlx"]
memgraph = ["dep:rsmgclient"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rsmgclient = { version = "4.0.0", optional = true }
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
], optional = true }
tokio = { version = "1.54.1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }

[dev-dependencies]

[build-dependencies]

[lints.clippy]
large_enum_variant = "deny"
perf = { level = "warn", priority = 1 }
redundant_clone = "deny"
trivially_copy_pass_by_ref = "warn"
large_types_passed_by_value = "warn"
clone_on_ref_ptr = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
str_to_string = "warn"
needless_collect = "warn"
large_futures = "warn"
missing_safety_doc = "deny"
panic = "deny"
todo = "warn"
unwrap_used = "deny"

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unsafe_code = "deny"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
lto = false

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
